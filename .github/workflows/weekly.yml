name: Market Rotation Weekly

on:
  schedule:
    # Sunday 6pm New York time. Cron is in UTC and GitHub's timer can be late or skip,
    # so it wakes at :05, :25 and :45 across the summer and winter UTC hours.
    # .github/gate.sh runs the first wake-up in the window and skips the rest.
    - cron: "5,25,45 22,23 * * 0"
    - cron: "5,25,45 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always use the latest code, even when re-running an old run

      - name: Gate on New York time
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/gate.sh

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch prices and build page
        if: steps.gate.outputs.run == 'true'
        run: |
          python macro.py --out macro.json || { echo "Yahoo busy, retrying in 60s"; sleep 60; python macro.py --out macro.json; }
          python dashboard_export.py macro.json data
          python build_page.py
          mkdir -p history
          asof=$(python -c "import json;print(json.load(open('macro.json'))['as_of'])")
          [ -f "history/$asof.json" ] || cp macro.json "history/$asof.json"

      - name: Save weekly snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "market-rotation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro.json data history index.html stamp.txt
          git commit -m "Market rotation $(date '+%Y-%m-%d')" || echo "No changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - name: Package site
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p _site && cp -r index.html stamp.txt data _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: _site

      - name: Publish to phone URL
        id: deploy
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's publish step sometimes fails for a moment; wait and try once more.
      - name: Retry publish
        if: steps.gate.outputs.run == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30
      - name: Publish to phone URL (retry)
        if: steps.gate.outputs.run == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
